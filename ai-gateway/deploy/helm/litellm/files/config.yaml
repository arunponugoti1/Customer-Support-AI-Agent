# LiteLLM gateway config. Model tiers map friendly names -> Vertex Gemini.
# Auth to Vertex is via Workload Identity (ADC) — no key file.
model_list:
  - model_name: fast
    litellm_params:
      model: vertex_ai/gemini-2.5-flash-lite
      vertex_project: gke-ai-platform
      vertex_location: us-central1
  - model_name: balanced
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: gke-ai-platform
      vertex_location: us-central1
  - model_name: smart
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: gke-ai-platform
      vertex_location: us-central1

litellm_settings:
  drop_params: true
  num_retries: 2
  # Emit Prometheus metrics (spend, requests, tokens per model/key) on /metrics.
  callbacks: ["prometheus"]
  # Allow the in-cluster Prometheus to scrape /metrics without a key.
  require_auth_for_metrics_endpoint: false
  # Auto-failover: if a stronger tier errors, fall back to a cheaper one.
  fallbacks: [{ "smart": ["balanced"] }, { "balanced": ["fast"] }]
  # Exact-match response cache in Redis — identical requests return instantly, near-zero cost.
  cache: true
  cache_params:
    type: redis
    host: redis-redis.support-agent.svc.cluster.local
    port: 6379
    ttl: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
