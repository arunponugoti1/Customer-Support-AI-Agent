# ArgoCD Applications — GitOps source of truth for the platform's deployments.
# ArgoCD continuously reconciles these Helm releases to git (auto-sync + self-heal).
# All deploy values (image repo/tag, Cloud SQL IP) live in the committed chart values.yaml,
# so the git repo is the single source of truth. The image tag is promoted by the
# eval-gated `promote.yml` workflow. Secrets stay out-of-band (ArgoCD does not manage them).
#
# Apply: kubectl apply -f deploy/argocd/applications.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arunponugoti1/Customer-Support-AI-Agent.git
    targetRevision: main
    path: support-agent-platform/deploy/helm/agent
  destination:
    server: https://kubernetes.default.svc
    namespace: support-agent
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: approval
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arunponugoti1/Customer-Support-AI-Agent.git
    targetRevision: main
    path: support-agent-platform/deploy/helm/approval
  destination:
    server: https://kubernetes.default.svc
    namespace: support-agent
  syncPolicy:
    automated: { prune: true, selfHeal: true }
