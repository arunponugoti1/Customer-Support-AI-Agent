# ArgoCD Applications — GitOps source of truth for the platform's deployments.
# ArgoCD continuously reconciles these Helm releases to git (auto-sync + self-heal).
# Per-deploy values (image repo/tag, Cloud SQL IP) live HERE in git (not passed at deploy),
# which is what makes it GitOps. Secrets stay out-of-band (ArgoCD does not manage them).
#
# Apply: kubectl apply -f deploy/argocd/applications.yaml
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arunponugoti1/Customer-Support-AI-Agent.git
    targetRevision: main
    path: support-agent-platform/deploy/helm/agent
    helm:
      parameters:
        - { name: image.repository, value: us-central1-docker.pkg.dev/gke-ai-platform/sap-images/agent }
        - { name: image.tag, value: "0.5.0" }
        - { name: env.dbHost, value: "10.104.0.3" }
  destination:
    server: https://kubernetes.default.svc
    namespace: support-agent
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: approval
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arunponugoti1/Customer-Support-AI-Agent.git
    targetRevision: main
    path: support-agent-platform/deploy/helm/approval
    helm:
      parameters:
        - { name: image.repository, value: us-central1-docker.pkg.dev/gke-ai-platform/sap-images/approval }
        - { name: image.tag, value: "0.3.0" }
        - { name: env.dbHost, value: "10.104.0.3" }
  destination:
    server: https://kubernetes.default.svc
    namespace: support-agent
  syncPolicy:
    automated: { prune: true, selfHeal: true }
