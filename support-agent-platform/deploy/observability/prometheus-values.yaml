# Lean Prometheus for the support-agent platform.
# Scrapes pods carrying prometheus.io/scrape annotations (llm-proxy, approval, gmail-connector)
# via the chart's built-in kubernetes-pods job — no ServiceMonitors needed.
server:
  retention: "6h"
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
  persistentVolume:
    enabled: false   # demo: in-memory; 6h retention keeps it small
  resources:
    requests:
      cpu: 50m
      memory: 300Mi
    limits:
      memory: 700Mi

alertmanager:
  enabled: true
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Trim the fat we don't need on a small cluster.
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: true
kube-state-metrics:
  enabled: true

# Alert rules over the metrics our services emit. (Wired in via the chart's default
# rule_files include of alerting_rules.yml.)
serverFiles:
  alerting_rules.yml:
    groups:
      - name: support-agent
        rules:
          - alert: ModelLatencyHighP95
            expr: histogram_quantile(0.95, sum(rate(llm_latency_ms_bucket[5m])) by (le)) > 8000
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Model p95 latency > 8s (last 5m)"
          - alert: ModelSpendBurnHigh
            expr: sum(rate(llm_cost_usd_total[15m])) * 3600 > 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Model spend burn > $1/hour"
          - alert: ApprovalExecutionFailure
            expr: increase(approval_actions_total{event="failed"}[10m]) > 0
            labels: { severity: critical }
            annotations:
              summary: "An approved action failed to execute"
          - alert: GmailConnectorErrors
            expr: increase(gmail_errors_total[10m]) > 3
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Gmail connector erroring (last 10m)"
