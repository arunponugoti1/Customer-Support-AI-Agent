apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-llm-proxy
  labels:
    {{- include "llmproxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "llmproxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmproxy.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: GCP_PROJECT
              value: "{{ .Values.env.gcpProject }}"
            - name: VERTEX_LOCATION
              value: "{{ .Values.env.vertexLocation }}"
            - name: MODEL
              value: "{{ .Values.env.model }}"
            {{- if .Values.env.openaiBaseUrl }}
            - name: OPENAI_BASE_URL
              value: "{{ .Values.env.openaiBaseUrl }}"
            {{- end }}
            {{- if .Values.env.llmApiKeySecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.llmApiKeySecret }}
                  key: {{ .Values.env.llmApiKeySecretKey | default "LITELLM_MASTER_KEY" }}
            {{- end }}
            - name: DB_HOST
              value: "{{ .Values.env.dbHost }}"
            - name: DB_NAME
              value: "{{ .Values.env.dbName }}"
            - name: DB_USER
              value: "{{ .Values.env.dbUser }}"
            - name: DB_PASSWORD_SECRET
              value: "{{ .Values.env.dbPasswordSecret }}"
            - name: ENABLE_TRACING
              value: "{{ .Values.env.enableTracing }}"
            - name: GUARDRAILS_ENABLED
              value: "{{ .Values.env.guardrailsEnabled }}"
            - name: GUARDRAILS_BLOCK_INJECTION
              value: "{{ .Values.env.guardrailsBlockInjection }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
