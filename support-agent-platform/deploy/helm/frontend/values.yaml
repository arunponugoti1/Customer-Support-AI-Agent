image:
  repository: REPLACE_AT_DEPLOY # us-central1-docker.pkg.dev/gke-ai-platform/sap-images/frontend
  tag: "0.1.1"
  pullPolicy: IfNotPresent

replicaCount: 1

# No Workload Identity needed — the frontend calls no GCP APIs; it only proxies HTTP to the
# internal ClusterIP services. Uses the namespace default ServiceAccount.

# Server-side targets for the /api/* proxy routes (cluster-internal DNS).
env:
  agentUrl: "http://agent-agent.support-agent.svc.cluster.local"
  approvalUrl: "http://approval-approval.support-agent.svc.cluster.local"
  proxyUrl: "http://llm-proxy-llm-proxy.support-agent.svc.cluster.local"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Public HTTPS via ingress-nginx + cert-manager (Let's Encrypt) on the DuckDNS host.
# Baked in so a `helm upgrade` without --reuse-values can't silently drop the Ingress.
ingress:
  enabled: true
  className: "nginx"
  host: "llm-agent.duckdns.org"
  tlsSecretName: frontend-tls
  clusterIssuer: letsencrypt-prod
  basicAuthSecret: frontend-basic-auth # k8s secret (key 'auth', htpasswd) — login at the edge

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
