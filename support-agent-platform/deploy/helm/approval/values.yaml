image:
  repository: REPLACE_AT_DEPLOY # us-central1-docker.pkg.dev/gke-ai-platform/sap-images/approval
  tag: "0.2.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# Reuse the Workload Identity KSA created by the llm-proxy release (same identity:
# cloudsql.client + secretAccessor + cloudtrace.agent are all on the sap-app GSA).
serviceAccountName: sap-app

env:
  gcpProject: gke-ai-platform
  dbHost: REPLACE_AT_DEPLOY # Cloud SQL private IP (terraform output)
  dbName: appdb
  dbUser: appuser
  dbPasswordSecret: db-password
  enableTracing: "true" # OpenTelemetry -> Cloud Trace

# ClusterIP by default (private). For the approval UI, use `kubectl port-forward`.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
